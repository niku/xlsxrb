name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish-gem:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1
        with:
          # The await step runs the latest rubygems-await, which failed on Ruby 4.0.9
          # after v0.2.1 was pushed. Nothing in this workflow installs the new gem.
          await-release: false
