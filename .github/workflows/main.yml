name: Ruby

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    name: Unit & Contract Tests
    strategy:
      matrix:
        ruby:
          - '4.0.5'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rake rubocop
      - name: Run Bundler Audit
        run: bundle exec rake bundle:audit
      - name: Run Steep Typecheck
        run: bundle exec rake typecheck
      - name: Run Unit & Contract Tests
        run: bundle exec rake test:rbs

  e2e:
    runs-on: ubuntu-latest
    name: E2E Interoperability Tests
    strategy:
      matrix:
        ruby:
          - '4.0.5'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run E2E Tests
        run: bundle exec rake test:e2e

  visual:
    runs-on: ubuntu-latest
    name: Visual Examples & VRT
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Test Environment Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: xlsxrb-test-env
          outputs: type=docker,dest=/tmp/xlsxrb-test-env.tar

      - name: Load Docker Image
        run: |
          docker load --input /tmp/xlsxrb-test-env.tar

      - name: Generate Visual Gallery
        run: |
          docker run --rm --user $(id -u):$(id -g) -v ${{ github.workspace }}:/workspaces/xlsxrb xlsxrb-test-env bundle exec rake visual:gallery

      - name: Run Visual Regression Tests
        run: |
          docker run --rm --user $(id -u):$(id -g) -v ${{ github.workspace }}:/workspaces/xlsxrb xlsxrb-test-env bundle exec rake test:visual

      - name: Upload Visual Output on Mismatch
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diffs
          path: test/visual/output/

      - name: Upload Explanation Gallery
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-gallery
          path: docs/visual/
